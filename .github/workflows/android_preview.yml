name: Android Preview
# Builds a PR's Android APK and distributes it with Firebase App Distribution. Add the
# `build-preview` label to a PR to build it; pushes rebuild while the label is on. The build
# installs as "iNat Preview" next to the Play Store app and points at staging.
#
# One-time setup:
# - Firebase: in the FIREBASE_PROJECT_ID project, add an Android app for
#   org.inaturalist.iNaturalistMobile.preview, open App Distribution for it, and create a
#   tester group
# - Secrets:
#   FIREBASE_PREVIEW_GOOGLE_APP_ID: the new app's App ID (1:...:android:...)
#   FIREBASE_APP_DISTRIBUTION_CREDENTIALS: JSON key for a service account with the
#     Firebase App Distribution Admin role
# - Variable: FIREBASE_PREVIEW_GROUPS: comma-separated tester group aliases
permissions:
  contents: read
  pull-requests: write
on:
  pull_request:
    types: [labeled, synchronize, reopened]

jobs:
  build:
    # Fork PRs don't get secrets
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && contains(github.event.pull_request.labels.*.name, 'build-preview')
      && (github.event.action != 'labeled' || github.event.label.name == 'build-preview')
    # Job-level so that adding an unrelated label doesn't cancel a build in progress
    concurrency:
      group: android-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Check out Git repository
      uses: actions/checkout@v6
      with:
        ref: ${{ github.event.pull_request.head.sha }}

    - name: Create .env.staging file
      env:
        IOS_OAUTH_CLIENT_ID: ${{ secrets.IOS_OAUTH_CLIENT_ID }}
        IOS_OAUTH_CLIENT_SECRET: ${{ secrets.IOS_OAUTH_CLIENT_SECRET }}
        ANDROID_OAUTH_CLIENT_ID: ${{ secrets.ANDROID_OAUTH_CLIENT_ID }}
        ANDROID_OAUTH_CLIENT_SECRET: ${{ secrets.ANDROID_OAUTH_CLIENT_SECRET }}
        JWT_ANONYMOUS_API_SECRET: ${{ secrets.JWT_ANONYMOUS_API_SECRET }}
        GMAPS_API_KEY: ${{ secrets.GMAPS_API_KEY }}
      run: |
        cat > .env.staging <<EOF
        API_URL=https://stagingapi.inaturalist.org/v2
        OAUTH_API_URL=https://staging.inaturalist.org
        JWT_ANONYMOUS_API_SECRET=$JWT_ANONYMOUS_API_SECRET
        IOS_OAUTH_CLIENT_ID=$IOS_OAUTH_CLIENT_ID
        IOS_OAUTH_CLIENT_SECRET=$IOS_OAUTH_CLIENT_SECRET
        ANDROID_OAUTH_CLIENT_ID=$ANDROID_OAUTH_CLIENT_ID
        ANDROID_OAUTH_CLIENT_SECRET=$ANDROID_OAUTH_CLIENT_SECRET
        GMAPS_API_KEY=$GMAPS_API_KEY
        ANDROID_MODEL_FILE_NAME=INatVision_Small_2_fact256_8bit.tflite
        ANDROID_TAXONOMY_FILE_NAME=taxonomy.csv
        ANDROID_GEOMODEL_FILE_NAME=INatGeomodel_Small_2_8bit.tflite
        IOS_MODEL_FILE_NAME=INatVision_Small_2_fact256_8bit.mlmodel
        IOS_TAXONOMY_FILE_NAME=taxonomy.json
        IOS_GEOMODEL_FILE_NAME=INatGeomodel_Small_2_8bit.mlmodel
        CV_MODEL_VERSION=small_2
        EOF

    - name: Create google-services.json
      env:
        FIREBASE_PROJECT_NUMBER: ${{ secrets.FIREBASE_PROJECT_NUMBER }}
        FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
        FIREBASE_PREVIEW_GOOGLE_APP_ID: ${{ secrets.FIREBASE_PREVIEW_GOOGLE_APP_ID }}
        FIREBASE_STAGING_API_KEY: ${{ secrets.FIREBASE_STAGING_API_KEY }}
      run: |
        GOOGLE_SERVICES_JSON=android/app/src/preview/google-services.json
        cp android/app/google-services.example.json "$GOOGLE_SERVICES_JSON"
        sed -i "s/your_project_number/${FIREBASE_PROJECT_NUMBER//\//\\/}/g" "$GOOGLE_SERVICES_JSON"
        sed -i "s/your_project_id/${FIREBASE_PROJECT_ID//\//\\/}/g" "$GOOGLE_SERVICES_JSON"
        sed -i "s/your_storage_bucket/${FIREBASE_STORAGE_BUCKET//\//\\/}/g" "$GOOGLE_SERVICES_JSON"
        sed -i "s/your_mobilesdk_app_id/${FIREBASE_PREVIEW_GOOGLE_APP_ID//\//\\/}/g" "$GOOGLE_SERVICES_JSON"
        sed -i "s/your_package_name/org.inaturalist.iNaturalistMobile.preview/g" "$GOOGLE_SERVICES_JSON"
        sed -i "s/your_current_key/${FIREBASE_STAGING_API_KEY//\//\\/}/g" "$GOOGLE_SERVICES_JSON"

    # build.gradle always reads this for the release signing config; preview builds are signed
    # with debug.keystore, so the values are never used
    - name: Create placeholder keystore.properties
      run: printf 'storePassword=unused\nkeyPassword=unused\nkeyAlias=unused\nstoreFile=unused.keystore' > android/keystore.properties

    - uses: actions/setup-node@v6
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'

    - uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5

    - name: Install JS dependencies
      run: npm ci

    - name: Download the small example cv and geomodel
      run: npm run add-example-model -- -f=main

    - name: Build APK
      working-directory: android
      # Every physical phone (incl. 32-bit-only ones) and Apple silicon emulators; release also
      # builds x86/x86_64, which only Intel emulators and Chromebooks need
      run: |
        ./gradlew assemblePreview \
          -PreactNativeArchitectures=arm64-v8a,armeabi-v7a \
          -PpreviewVersionCode=${{ github.run_number }}

    - name: Distribute with Firebase App Distribution
      id: distribute
      env:
        FIREBASE_APP_DISTRIBUTION_CREDENTIALS: ${{ secrets.FIREBASE_APP_DISTRIBUTION_CREDENTIALS }}
        FIREBASE_PREVIEW_GOOGLE_APP_ID: ${{ secrets.FIREBASE_PREVIEW_GOOGLE_APP_ID }}
        FIREBASE_PREVIEW_GROUPS: ${{ vars.FIREBASE_PREVIEW_GROUPS }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_TITLE: ${{ github.event.pull_request.title }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        set -o pipefail
        export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-credentials.json"
        printf '%s' "$FIREBASE_APP_DISTRIBUTION_CREDENTIALS" > "$GOOGLE_APPLICATION_CREDENTIALS"
        printf '#%s %s\n%s\n' "$PR_NUMBER" "$PR_TITLE" "${HEAD_SHA:0:7}" > "$RUNNER_TEMP/release-notes.txt"
        npx --yes firebase-tools@15.33.0 appdistribution:distribute \
          android/app/build/outputs/apk/preview/*-preview.apk \
          --app "$FIREBASE_PREVIEW_GOOGLE_APP_ID" \
          --groups "$FIREBASE_PREVIEW_GROUPS" \
          --release-notes-file "$RUNNER_TEMP/release-notes.txt" \
          | tee "$RUNNER_TEMP/distribute.log"
        # firebase-tools only prints the tester link; there's no --json output for it
        TESTING_URI=$(sed -n 's/.*Share this release with testers who have access: //p' \
          "$RUNNER_TEMP/distribute.log" | head -n 1)
        echo "testing_uri=$TESTING_URI" >> "$GITHUB_OUTPUT"

    - name: Comment on PR
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        TESTING_URI: ${{ steps.distribute.outputs.testing_uri }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        MARKER="<!-- android-preview -->"
        if [ -n "$TESTING_URI" ]; then
          LINK="[Open in App Distribution]($TESTING_URI)"
        else
          LINK="Uploaded to App Distribution; the tester link wasn't in the [build log]($RUN_URL)"
        fi
        BODY="$MARKER
        **Android preview** for ${HEAD_SHA:0:7}: $LINK

        Installs as \"iNat Preview\" next to the Play Store app and uses staging."
        # Update one comment per PR instead of adding a new one per push
        COMMENT_ID=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
          --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" | tail -n 1)
        if [ -n "$COMMENT_ID" ]; then
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" -f body="$BODY"
        else
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$BODY"
        fi
